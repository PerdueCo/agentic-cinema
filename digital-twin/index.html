<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Twin — Episode 1: Build the Facility</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --void:#05080a;
    --panel:#0b1216;
    --panel-2:#0f181d;
    --line:#1c2b31;
    --cyan:#5fd8e0;
    --cyan-dim:#2c6a70;
    --amber:#e8a33d;
    --white:#eef4f5;
    --grey:#7f9296;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'IBM Plex Mono', monospace;
  }
  canvas{display:block;}

  #scene-container{position:fixed;inset:0;}

  /* ---------- boot / loading ---------- */
  #boot{
    position:fixed;inset:0;
    background:var(--void);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;
    z-index:50;
    transition:opacity 1.1s ease;
  }
  #boot.hidden{opacity:0;pointer-events:none;}
  .boot-mark{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;letter-spacing:0.35em;
    color:var(--cyan);text-transform:uppercase;
  }
  .boot-bar{
    width:260px;height:2px;background:var(--line);position:relative;overflow:hidden;
  }
  .boot-bar::after{
    content:'';position:absolute;left:-40%;top:0;bottom:0;width:40%;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    animation:sweep 1.3s linear infinite;
  }
  @keyframes sweep{0%{left:-40%;}100%{left:100%;}}
  .boot-sub{font-size:10px;color:var(--grey);letter-spacing:0.15em;}

  /* ---------- skip control ---------- */
  #skip{
    position:fixed;bottom:26px;right:30px;z-index:40;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;
    color:var(--grey);background:rgba(11,18,22,0.55);
    border:1px solid var(--line);padding:9px 16px;cursor:pointer;
    text-transform:uppercase;transition:all .25s ease;
    backdrop-filter:blur(3px);
  }
  #skip:hover{color:var(--cyan);border-color:var(--cyan-dim);}
  #skip.gone{opacity:0;pointer-events:none;}

  /* ---------- corner framing (always present, subtle) ---------- */
  .brack{position:fixed;width:26px;height:26px;border-color:var(--cyan-dim);opacity:0.55;z-index:30;pointer-events:none;}
  .brack.tl{top:22px;left:22px;border-top:1px solid;border-left:1px solid;}
  .brack.tr{top:22px;right:22px;border-top:1px solid;border-right:1px solid;}
  .brack.bl{bottom:22px;left:22px;border-bottom:1px solid;border-left:1px solid;}
  .brack.br{bottom:22px;right:22px;border-bottom:1px solid;border-right:1px solid;}

  #sitelabel{
    position:fixed;top:26px;left:56px;z-index:30;
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;letter-spacing:0.3em;color:var(--grey);
    text-transform:uppercase;
  }
  #sitelabel b{color:var(--cyan);font-weight:600;}

  /* ---------- HUD result panel ---------- */
  #hud{
    position:fixed;inset:0;z-index:35;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(5,8,10,0.35) 0%, rgba(5,8,10,0.86) 72%);
    opacity:0;pointer-events:none;
    transition:opacity 1.4s ease;
  }
  #hud.show{opacity:1;pointer-events:auto;}

  .console{
    width:min(720px,88vw);
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(15,24,29,0.92), rgba(9,14,17,0.96));
    box-shadow:0 0 0 1px rgba(95,216,224,0.05), 0 30px 80px rgba(0,0,0,0.6);
    position:relative;
  }
  .console::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .console-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;border-bottom:1px solid var(--line);
  }
  .console-head .tag{
    font-size:10px;letter-spacing:0.25em;color:var(--cyan-dim);text-transform:uppercase;
  }
  .console-head .dot{
    width:7px;height:7px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 8px var(--amber);
    display:inline-block;margin-right:8px;
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}

  .console-title{
    padding:26px 28px 6px;
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;font-weight:600;letter-spacing:0.02em;
    color:var(--white);
  }
  .console-title span{color:var(--amber);}

  .grid-status{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:1px;background:var(--line);
    margin:22px 28px 8px;border:1px solid var(--line);
  }
  .stat{
    background:var(--panel-2);padding:16px 18px;
  }
  .stat .k{
    font-size:9px;letter-spacing:0.2em;color:var(--grey);text-transform:uppercase;margin-bottom:8px;
  }
  .stat .v{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;font-weight:600;color:var(--cyan);
    display:flex;align-items:baseline;gap:8px;
  }
  .stat .v.offline{color:var(--grey);}
  .stat .v small{font-size:10px;font-weight:400;color:var(--grey);letter-spacing:0.1em;}

  .narrator{
    margin:14px 28px 28px;padding:18px 20px;
    border-left:2px solid var(--cyan-dim);
    background:rgba(95,216,224,0.03);
  }
  .narrator .who{
    font-size:9px;letter-spacing:0.25em;color:var(--cyan-dim);text-transform:uppercase;margin-bottom:9px;
  }
  .narrator p{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;line-height:1.65;color:var(--white);
    font-weight:400;
  }
  .narrator .cursor{
    display:inline-block;width:7px;height:14px;background:var(--cyan);
    margin-left:2px;vertical-align:-2px;
    animation:blink 0.9s steps(1) infinite;
  }
</style>
</head>
<body>

<div id="scene-container"></div>

<div id="boot">
  <div class="boot-mark">Digital Twin // Episode 01</div>
  <div class="boot-bar"></div>
  <div class="boot-sub">CONSTRUCTING VIRTUAL SITE…</div>
</div>

<div class="brack tl"></div><div class="brack tr"></div><div class="brack bl"></div><div class="brack br"></div>
<div id="sitelabel">Site&nbsp;07 — <b>Hollow Ridge</b> Generating Station</div>
<div id="skip">Skip flyover →</div>

<div id="hud">
  <div class="console">
    <div class="console-head">
      <div class="tag"><span class="dot"></span>DIGITAL TWIN INITIALIZED</div>
      <div class="tag" id="clock">00:00:00</div>
    </div>
    <div class="console-title">Facility Status — <span>Offline</span></div>
    <div class="grid-status">
      <div class="stat"><div class="k">Assets Created</div><div class="v" id="v-assets">0</div></div>
      <div class="stat"><div class="k">Sensors Connected</div><div class="v offline" id="v-sensors">0</div></div>
      <div class="stat"><div class="k">Telemetry</div><div class="v offline" id="v-telemetry">Inactive</div></div>
      <div class="stat"><div class="k">AI Agents</div><div class="v offline" id="v-ai">Offline</div></div>
    </div>
    <div class="narrator">
      <div class="who">Narrator</div>
      <p id="narrator-text"><span class="cursor"></span></p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

/* ============================================================
   SETUP
   ============================================================ */
const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
const skyTop = new THREE.Color(0x0d1b24);
const skyBottom = new THREE.Color(0x3c5a68);
scene.background = skyTop;
scene.fog = new THREE.Fog(0x28414c, 140, 620);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.5, 2000);
camera.position.set(0, 60, 220);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace || renderer.outputColorSpace;
container.appendChild(renderer.domElement);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* sky gradient dome */
(function skyDome(){
  const geo = new THREE.SphereGeometry(900, 24, 16);
  const mat = new THREE.ShaderMaterial({
    uniforms:{ top:{value:skyTop}, bottom:{value:skyBottom} },
    vertexShader:`varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vPos; uniform vec3 top; uniform vec3 bottom;
      void main(){
        float h = normalize(vPos).y * 0.5 + 0.5;
        gl_FragColor = vec4(mix(bottom, top, pow(h, 0.7)), 1.0);
      }`,
    side: THREE.BackSide
  });
  scene.add(new THREE.Mesh(geo, mat));
})();

/* lights */
const hemi = new THREE.HemisphereLight(0x9db9c4, 0x1a2420, 0.65);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9c4, 1.25);
sun.position.set(-180, 220, 120);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -260; sun.shadow.camera.right = 260;
sun.shadow.camera.top = 260; sun.shadow.camera.bottom = -260;
sun.shadow.camera.far = 700;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x3a4a52, 0.35));

/* ============================================================
   MATERIAL PALETTE
   ============================================================ */
const M = {
  concrete: new THREE.MeshStandardMaterial({color:0xb7bcb9, roughness:0.9, metalness:0.05}),
  concreteDark: new THREE.MeshStandardMaterial({color:0x8c918e, roughness:0.95}),
  concreteWhite: new THREE.MeshStandardMaterial({color:0xd8dcd8, roughness:0.85}),
  steelBlue: new THREE.MeshStandardMaterial({color:0x3b5568, roughness:0.55, metalness:0.4}),
  steelDark: new THREE.MeshStandardMaterial({color:0x2b3238, roughness:0.5, metalness:0.55}),
  rust: new THREE.MeshStandardMaterial({color:0x8a5a3a, roughness:0.8}),
  roof: new THREE.MeshStandardMaterial({color:0x445a63, roughness:0.6, metalness:0.2}),
  domeMat: new THREE.MeshStandardMaterial({color:0xe7e9e4, roughness:0.4, metalness:0.15}),
  glassAmber: new THREE.MeshStandardMaterial({color:0xffc978, emissive:0xffa93d, emissiveIntensity:0.9, roughness:0.4}),
  glassCyan: new THREE.MeshStandardMaterial({color:0x8fe9ee, emissive:0x2fb9c2, emissiveIntensity:0.7, roughness:0.4}),
  grass: new THREE.MeshStandardMaterial({color:0x30432f, roughness:1.0}),
  grassLight: new THREE.MeshStandardMaterial({color:0x3c5539, roughness:1.0}),
  asphalt: new THREE.MeshStandardMaterial({color:0x21262a, roughness:0.95}),
  asphaltLine: new THREE.MeshStandardMaterial({color:0xd8d4c4, roughness:0.8}),
  water: new THREE.MeshStandardMaterial({color:0x1c4a5e, roughness:0.25, metalness:0.35, transparent:true, opacity:0.92}),
  bark: new THREE.MeshStandardMaterial({color:0x4a3626, roughness:1.0}),
  foliageA: new THREE.MeshStandardMaterial({color:0x3f6e3f, roughness:1.0}),
  foliageB: new THREE.MeshStandardMaterial({color:0x336237, roughness:1.0}),
  mountain: new THREE.MeshStandardMaterial({color:0x4a5560, roughness:1.0}),
  mountainSnow: new THREE.MeshStandardMaterial({color:0xe8edf0, roughness:0.9}),
  yellow: new THREE.MeshStandardMaterial({color:0xd9a520, roughness:0.7}),
  red: new THREE.MeshStandardMaterial({color:0xa63a2e, roughness:0.6}),
  white: new THREE.MeshStandardMaterial({color:0xe9e9e4, roughness:0.6}),
  insulator: new THREE.MeshStandardMaterial({color:0x5f4c3a, roughness:0.7}),
  car1: new THREE.MeshStandardMaterial({color:0x7a3b3b, roughness:0.5, metalness:0.3}),
  car2: new THREE.MeshStandardMaterial({color:0x33475c, roughness:0.5, metalness:0.3}),
  car3: new THREE.MeshStandardMaterial({color:0x555a5c, roughness:0.5, metalness:0.3}),
};

const group = new THREE.Group();
scene.add(group);
let assetCount = 0; // major named facility assets, per brief (9)

function addMesh(mesh, castShadow=true, receiveShadow=true){
  mesh.castShadow = castShadow;
  mesh.receiveShadow = receiveShadow;
  group.add(mesh);
  return mesh;
}
function box(w,h,d,mat,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  return addMesh(m);
}
function cyl(rt,rb,h,mat,x,y,z,seg=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z);
  return addMesh(m);
}
function cone(r,h,mat,x,y,z,seg=10){
  const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), mat);
  m.position.set(x,y,z);
  return addMesh(m);
}

/* ============================================================
   GROUND
   ============================================================ */
(function ground(){
  const geo = new THREE.PlaneGeometry(1400,1400,1,1);
  geo.rotateX(-Math.PI/2);
  const g = new THREE.Mesh(geo, M.grass);
  g.receiveShadow = true;
  g.position.y = -0.05;
  group.add(g);

  // subtle mottled patches for variation
  for(let i=0;i<50;i++){
    const s = 20 + Math.random()*55;
    const p = new THREE.Mesh(new THREE.CircleGeometry(s, 8), Math.random()>0.5?M.grassLight:M.grass);
    p.rotation.x = -Math.PI/2;
    p.position.set((Math.random()-0.5)*900,0.0,(Math.random()-0.5)*900);
    p.receiveShadow = true;
    group.add(p);
  }
})();

/* ============================================================
   RIVER  (winding strip along western edge)
   ============================================================ */
const riverCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-165,0,-260),
  new THREE.Vector3(-150,0,-160),
  new THREE.Vector3(-168,0,-70),
  new THREE.Vector3(-140,0,10),
  new THREE.Vector3(-158,0,90),
  new THREE.Vector3(-130,0,190),
  new THREE.Vector3(-145,0,270),
]);
(function river(){
  const pts = riverCurve.getPoints(80);
  const shape = [];
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    const dir = new THREE.Vector3().subVectors(b,a).normalize();
    const normal = new THREE.Vector3(-dir.z,0,dir.x);
    const width = 20 + Math.sin(i*0.3)*3;
    shape.push([a.clone().addScaledVector(normal,width), a.clone().addScaledVector(normal,-width)]);
  }
  const vertices = [];
  const indices = [];
  shape.forEach(([l,r])=>{ vertices.push(l.x,0.05,l.z, r.x,0.05,r.z); });
  for(let i=0;i<shape.length-1;i++){
    const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;
    indices.push(a,c,b, b,c,d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices,3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const riverMesh = new THREE.Mesh(geo, M.water);
  riverMesh.receiveShadow = true;
  group.add(riverMesh);

  // bank strips (sand/rock)
  const bankGeo = geo.clone();
  const bankMesh = new THREE.Mesh(bankGeo, new THREE.MeshStandardMaterial({color:0x6b6455, roughness:1}));
  bankMesh.scale.set(1.12,1,1.12);
  bankMesh.position.y = -0.02;
  bankMesh.receiveShadow = true;
  group.add(bankMesh);
})();

/* ============================================================
   MOUNTAINS (background, far west/north)
   ============================================================ */
(function mountains(){
  const positions = [
    [-260,0,-140,70,150],[-300,0,-40,90,190],[-270,0,60,75,160],
    [-310,0,160,85,175],[-250,0,240,60,130],[-150,0,-320,80,170],
    [10,0,-330,95,200],[160,0,-320,75,160],[280,0,-260,70,150],
    [-330,0,300,65,140],
  ];
  positions.forEach(([x,y,z,r,h])=>{
    const m = cone(r,h,M.mountain,x,h/2-4,z,5);
    m.rotation.y = Math.random()*Math.PI;
    const snow = cone(r*0.34,h*0.32,M.mountainSnow,x,h-4,z,5);
    snow.receiveShadow = false;
  });
})();

/* ============================================================
   TREES
   ============================================================ */
function tree(x,z,scale=1){
  const s = scale*(0.8+Math.random()*0.5);
  const trunkH = 3.2*s;
  cyl(0.28*s,0.38*s,trunkH,M.bark,x,trunkH/2,z,6);
  const mat = Math.random()>0.5?M.foliageA:M.foliageB;
  cone(2.1*s,4.4*s,mat,x,trunkH+2.0*s,z,7);
  cone(1.6*s,3.4*s,mat,x,trunkH+4.0*s,z,7);
  cone(1.0*s,2.4*s,mat,x,trunkH+5.6*s,z,7);
}
function treeCluster(cx,cz,count,radius){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, r = Math.random()*radius;
    tree(cx+Math.cos(a)*r, cz+Math.sin(a)*r, 0.7+Math.random()*0.8);
  }
}
// along riverbank
riverCurve.getPoints(22).forEach(p=>{
  if(Math.random()>0.35) tree(p.x-28-Math.random()*18, p.z+(Math.random()-0.5)*20, 0.8+Math.random()*0.6);
});
// perimeter forest belts
treeCluster(-90,-230,18,45);
treeCluster(120,-230,16,50);
treeCluster(180,120,20,55);
treeCluster(-40,230,14,40);
treeCluster(200,220,16,45);
treeCluster(-190,220,12,40);

/* ============================================================
   ROADS
   ============================================================ */
function roadSegment(x1,z1,x2,z2,width=8){
  const dx=x2-x1, dz=z2-z1;
  const len = Math.sqrt(dx*dx+dz*dz);
  const ang = Math.atan2(dx,dz);
  const r = box(width,0.12,len,M.asphalt,(x1+x2)/2,0.06,(z1+z2)/2,ang);
  const line = box(0.4,0.13,len*0.94,M.asphaltLine,(x1+x2)/2,0.13,(z1+z2)/2,ang);
  return r;
}
// entrance road (south) -> gate -> plant loop -> yard
roadSegment(0,300, 0,110, 9);      // approach
roadSegment(0,110, 0,60, 9);       // gate to inner
roadSegment(0,60, -18,20, 9);      // toward parking / plant
roadSegment(-18,20, -18,-30, 7);   // along parking
roadSegment(-18,20, 20,10, 7);     // to turbine/control
roadSegment(20,10, 46,-10, 7);     // toward switchyard
roadSegment(46,-10, 70,-30, 7);    // to substation
roadSegment(-18,-30, -55,-25, 6);  // to cooling tower service rd
roadSegment(-18,20, -8,55, 6);     // to weather station spur

/* ============================================================
   PARKING LOT
   ============================================================ */
(function parking(){
  addMesh(new THREE.Mesh(new THREE.BoxGeometry(46,0.1,30), M.asphalt)).position.set(-40,0.05,10);
  for(let i=0;i<7;i++){
    const lm = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.12,7), M.asphaltLine);
    lm.position.set(-58+i*6,0.11,10);
    addMesh(lm,false);
  }
  const carMats=[M.car1,M.car2,M.car3];
  for(let i=0;i<10;i++){
    if(Math.random()>0.35){
      const cx=-58+i*6+(Math.random()*1-0.5), cz= 6+Math.random()*8;
      const body = box(1.7,0.9,3.6, carMats[i%3], cx,0.5,cz, (Math.random()-0.5)*0.15);
      box(1.3,0.5,1.6, M.steelDark, cx, 1.0, cz-0.3);
    }
  }
})();

/* ============================================================
   1) REACTOR BUILDING  — dome containment
   ============================================================ */
const REACTOR = {x:-30, z:-5};
(function reactorBuilding(){
  const base = cyl(15,16,22, M.concrete, REACTOR.x,11,REACTOR.z,24);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(15,24,16,0,Math.PI*2,0,Math.PI/2), M.domeMat);
  dome.position.set(REACTOR.x,22,REACTOR.z);
  addMesh(dome);
  // banding detail
  for(let i=0;i<3;i++){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(15.1,0.25,6,32), M.concreteDark);
    ring.rotation.x = Math.PI/2;
    ring.position.set(REACTOR.x, 3+i*7, REACTOR.z);
    addMesh(ring);
  }
  // small aux structure
  box(10,9,12,M.concreteDark, REACTOR.x+20, 4.5, REACTOR.z+6);
  cyl(1.4,1.4,26,M.steelDark, REACTOR.x+18, 13, REACTOR.z-14,8); // vent stack
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8), M.red);
  beacon.position.set(REACTOR.x,37.5,REACTOR.z);
  addMesh(beacon,false);
})();
assetCount++;

/* ============================================================
   2) TURBINE BUILDING — long gabled hall
   ============================================================ */
const TURBINE = {x:14, z:0};
(function turbineBuilding(){
  box(46,16,22, M.concreteWhite, TURBINE.x,8,TURBINE.z);
  // gabled roof via two angled boxes
  const roofL = box(24,1.2,22, M.roof, TURBINE.x-0.2,16.6,TURBINE.z);
  roofL.rotation.z = 0.42;
  const roofR = box(24,1.2,22, M.roof, TURBINE.x+0.2+23*0 + 0,16.6,TURBINE.z);
  // simpler: reposition R correctly
  roofR.position.set(TURBINE.x, 16.6, TURBINE.z);

function latticeTower(x,z,h=16){
  const g = new THREE.Group();
  const baseW=3.2, topW=0.9;
  for(let i=0;i<4;i++){
    const ang = (i/4)*Math.PI*2 + Math.PI/4;
    const geo = new THREE.CylinderGeometry(0.09,0.09,h,4);
    const leg = new THREE.Mesh(geo, M.steelDark);
    const bx = Math.cos(ang)*baseW*0.5, bz = Math.sin(ang)*baseW*0.5;
    leg.position.set(bx*0.5, h/2, bz*0.5);
    leg.rotation.z = Math.atan2(bx, h) ;
    g.add(leg);
  }
  // simplified solid lattice look using a tapered box core + cross braces
  const core = new THREE.Mesh(new THREE.CylinderGeometry(topW*0.5, baseW*0.5, h, 4), M.steelDark);
  core.rotation.y = Math.PI/4;
  core.castShadow = true;
  g.add(core);
  for(let i=1;i<5;i++){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(baseW*0.5*(1-i/6),0.05,4,4), M.steelDark);
    ring.rotation.x = Math.PI/2; ring.rotation.y = Math.PI/4;
    ring.position.y = i*h/5.2;
    g.add(ring);
  }
  const arm = new THREE.Mesh(new THREE.BoxGeometry(6.4,0.15,0.15), M.steelDark);
  arm.position.y = h*0.92;
  g.add(arm);
  // insulator strings + conductor stubs
  [-2.6,0,2.6].forEach(off=>{
    const ins = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.14,1.1,6), M.insulator);
    ins.position.set(off, h*0.92-0.6, 0);
    g.add(ins);
  });
  g.position.set(x,0,z);
  g.traverse(o=>{ if(o.isMesh){o.castShadow=true; o.receiveShadow=true;} });
  group.add(g);
  return g;
}

}

const posCurve = new THREE.CatmullRomCurve3(posPoints, false, 'catmullrom', 0.5);
const lookCurve = new THREE.CatmullRomCurve3(lookPoints, false, 'catmullrom', 0.5);

const FLIGHT_DURATION = 26000; // ms
let flightStart = null;
let flightDone = false;

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function finishFlight(){
  if(flightDone) return;
  flightDone = true;
  document.getElementById('skip').classList.add('gone');
  const finalPos = posCurve.getPoint(1);
  const finalLook = lookCurve.getPoint(1);
  camera.position.copy(finalPos);
  camera.lookAt(finalLook);
  revealHUD();
}

document.getElementById('skip').addEventListener('click', ()=>{
  finishFlight();
});

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate(now){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // gentle steam / idle motion could go here if desired

  if(!flightDone){
    if(flightStart===null) flightStart = now;
    const raw = Math.min((now-flightStart)/FLIGHT_DURATION, 1);
    const e = easeInOutCubic(raw);
    const p = posCurve.getPoint(e);
    const l = lookCurve.getPoint(e);
    camera.position.copy(p);
    camera.lookAt(l);
    if(raw>=1) finishFlight();
  } else {
    // slow ambient drift on the settled establishing shot
    const drift = Math.sin(t*0.05)*4;
    camera.position.x += Math.sin(t*0.03)*0.0; // static, HUD is the focus
  }

  renderer.render(scene, camera);
}

/* ============================================================
   HUD REVEAL
   ============================================================ */
function countUp(el, target, suffix=''){
  let cur = 0;
  const step = Math.max(1, Math.ceil(target/24));
  const iv = setInterval(()=>{
    cur = Math.min(target, cur+step);
    el.textContent = cur+suffix;
    if(cur>=target) clearInterval(iv);
  }, 40);
}

function typewriter(el, text, speed=28){
  let i=0;
  const cursor = document.createElement('span');
  cursor.className='cursor';
  el.textContent='';
  el.appendChild(cursor);
  const iv = setInterval(()=>{
    if(i<text.length){
      el.insertBefore(document.createTextNode(text[i]), cursor);
      i++;
    } else {
      clearInterval(iv);
    }
  }, speed);
}

function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toTimeString().slice(0,8);
}
setInterval(updateClock, 1000);

let hudRevealed = false;
function revealHUD(){
  if(hudRevealed) return;
  hudRevealed = true;
  const hud = document.getElementById('hud');
  setTimeout(()=>{
    hud.classList.add('show');
    countUp(document.getElementById('v-assets'), 9);
    typewriter(
      document.getElementById('narrator-text'),
      "Every Digital Twin begins with a digital representation of the physical world. Before intelligence comes structure. Before AI comes architecture.",
      26
    );
  }, 500);
}
